services:
  - type: web
    name: netfly-sport-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Baza Postgres (Neon): vendoset si env var DATABASE_URL në dashboardin e Render-it
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
