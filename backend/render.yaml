services:
  - type: web
    name: netfly-sport-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Baza Postgres (Supabase): vendoset si env var DATABASE_URL në dashboardin e Render-it.
      # Duhet të jetë URL-ja e "Transaction pooler" (port 6543, pgbouncer=true, IPv4!):
      # postgresql://postgres.<ref>:<PASSWORD>@aws-<n>-<region>.pooler.supabase.com:6543/postgres?sslmode=require&pgbouncer=true&connection_limit=5&pool_timeout=20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
