services:
  - type: web
    name: netfly-sport-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Baza Postgres (Supabase): vendoset si env var DATABASE_URL në dashboardin e Render-it.
      # Duhet të jetë URL-ja e "Session pooler" (IPv4!) — host-i direkt db.<ref>.supabase.co shtë IPv6-only:
      # postgresql://postgres.<ref>:<PASSWORD>@aws-<n>-<region>.pooler.supabase.com:5432/postgres?sslmode=require&connection_limit=10&pool_timeout=30
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
